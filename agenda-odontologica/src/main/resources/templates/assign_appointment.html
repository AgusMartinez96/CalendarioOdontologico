<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asignar Turno</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}"/>
</head>
<body>
<h2>Asignar Turno</h2>

<!-- Mostrar datos del paciente -->
<div>
    <p><strong>ID Paciente:</strong> <span th:text="${patientId}"></span></p>
</div>

<!-- Formulario para asignar turno -->
<form th:action="@{/appointments/save}" method="post">
    <input type="hidden" th:value="${patientId}" name="patientId"/>

    <label for="fecha">Fecha y Hora:</label>
    <input type="datetime-local" id="fecha" name="fecha" required/><br/>

    <label for="asistencia">Asistencia:</label>
    <select id="asistencia" name="asistencia">
        <option value="false">No</option>
        <option value="true">Sí</option>
    </select><br/>

    <button type="submit">Guardar Turno</button>
</form>

<!-- Link de regreso -->
<a th:href="@{/appointments/list}">Volver a la Lista de Turnos</a>
</body>
</html>
