spring.application.name=agenda-odontologica
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/odontologia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agenda}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agenda}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.time-zone=${APP_TIME_ZONE:America/Argentina/Buenos_Aires}
springdoc.swagger-ui.path=/swagger-ui.html
